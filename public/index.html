<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>풀이로그</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <button id="menu" class="icon-button mobile-menu" aria-label="메뉴 접기" aria-controls="teacher-sidebar" aria-expanded="true" title="메뉴 접기">☰</button>
  <aside class="sidebar" id="teacher-sidebar">
    <a class="brand" href="#overview" aria-label="풀이로그 홈"><span class="brand-icon" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M8 5h13a4 4 0 0 1 4 4v18H10a4 4 0 0 1-4-4V7a2 2 0 0 1 2-2Z"/><path d="M6 22h19M13 10l6 4-6 4Z"/></svg></span><div>풀이로그</div></a>
    <div class="workspace"><span class="workspace-icon">NK</span><div>나의 수학 클리닉<small>안산 · 강사 워크스페이스</small></div><span class="workspace-arrow">⌄</span></div>
    <p class="nav-label">메뉴</p>
    <nav id="nav"></nav>
    <div class="sidebar-bottom"><div class="demo-dot"></div><b>선생님 관리</b><p>등록한 학생과 반에 맞춰 영상을 제공해요.</p></div>
    <div class="profile"><span class="avatar">김</span><div>김형철 선생님<small>클리닉 팀장</small></div><span class="profile-status"></span></div>
  </aside>
  <button id="sidebar-shade" class="sidebar-shade" aria-label="메뉴 닫기" tabindex="-1"></button>
  <div class="shell">
    <header class="topbar"><div class="breadcrumbs">나의 클리닉 <span>/</span> <b id="breadcrumb">대시보드</b></div><div class="top-actions"><button class="mode-button" id="mode">학생 화면 보기 <span>↗</span></button></div></header>
    <main id="app"></main>
    <footer>풀이로그</footer>
  </div>
  <div class="modal-backdrop" id="modal" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><button class="modal-close icon-button" id="close-modal" aria-label="닫기">×</button><div id="modal-content"></div></section></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="search.js"></script>
  <script src="app.js"></script>
<script src="teacher.js"></script>
